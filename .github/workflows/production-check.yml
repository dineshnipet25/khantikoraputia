name: Production readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/khanti_koraputia_test
      COOKIE_SECURE: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khanti_koraputia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khanti_koraputia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Require application source
        run: |
          test -f package.json
          test -f src/app/page.tsx
          test -f src/db/schema.ts

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund; fi

      - name: Apply database schema
        run: npm run db:push

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Next type generation
        run: npx next typegen

      - name: Build
        run: npm run build

      - name: Browser tests
        if: ${{ hashFiles('tests/platform.spec.ts') != '' }}
        run: npm test
