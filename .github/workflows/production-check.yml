name: Production readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require application source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || { echo 'package.json missing'; exit 1; }
          test -f package-lock.json || { echo 'package-lock.json missing; commit a lockfile before launch'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Next type generation
        run: npx next typegen

      - name: Build
        run: npm run build

      - name: Browser tests
        if: ${{ hashFiles('tests/platform.spec.ts') != '' }}
        run: npx playwright test tests/platform.spec.ts --workers=1
