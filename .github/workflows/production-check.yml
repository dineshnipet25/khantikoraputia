name: Production readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require application source
        run: |
          test -f package.json
          test -f src/app/page.tsx
          test -f src/db/schema.ts
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install --ignore-scripts --no-audit --no-fund; fi
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Next type generation
        run: npx next typegen
      - name: Build
        run: npm run build
      - name: Browser tests
        if: ${{ hashFiles('tests/platform.spec.ts') != '' }}
        run: npm test
