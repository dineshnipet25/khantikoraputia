name: Materialize and harden application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect source archive
        id: archive
        shell: bash
        run: echo "present=$([ -f koraput-digital-business-ecosystem.zip ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        if: steps.archive.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract source archive
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .materialized
          mkdir .materialized
          unzip -q koraput-digital-business-ecosystem.zip -d .materialized
          if [ -f .materialized/package.json ]; then
            cp -a .materialized/. .
          else
            candidates=(.materialized/*/package.json)
            test ${#candidates[@]} -gt 0
            project_dir="${candidates[0]%/package.json}"
            cp -a "$project_dir"/. .
          fi
      - name: Apply production hardening
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp .github/production-hardening/package.json package.json
          cp .github/production-hardening/next.config.ts next.config.ts
          cp .github/production-hardening/src/lib/auth.ts src/lib/auth.ts
          cp .github/production-hardening/src/db/schema.ts src/db/schema.ts
          cp .github/production-hardening/src/db/index.ts src/db/index.ts
          cp .github/production-hardening/src/app/api/platform/route.ts src/app/api/platform/route.ts
          cp .github/production-hardening/src/app/api/uploads/route.ts src/app/api/uploads/route.ts
          cp .github/production-hardening/src/app/api/uploads/[id]/route.ts src/app/api/uploads/[id]/route.ts
          mkdir -p src/app/privacy src/app/terms
          cp .github/production-hardening/src/app/privacy/page.tsx src/app/privacy/page.tsx
          cp .github/production-hardening/src/app/terms/page.tsx src/app/terms/page.tsx
          cp .github/production-hardening/src/app/robots.ts src/app/robots.ts
          cp .github/production-hardening/src/app/sitemap.ts src/app/sitemap.ts
      - name: Create reproducible lockfile
        if: steps.archive.outputs.present == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove source archive
        if: steps.archive.outputs.present == 'true'
        run: rm -f koraput-digital-business-ecosystem.zip
      - name: Verify application source exists
        if: steps.archive.outputs.present == 'true'
        run: |
          test -f package.json
          test -f package-lock.json
          test -f src/app/page.tsx
          test -f src/db/schema.ts
      - name: Commit materialized production source
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize and harden production application' || exit 0
          git push
